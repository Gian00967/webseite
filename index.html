<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tic‑Tac‑Toe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>Tic‑Tac‑Toe — Du vs Computer</h1>
    <div class="scoreboard">
      <div id="score-human" class="score">Du: <span id="score-human-val">0</span></div>
      <div id="score-ai" class="score">Computer: <span id="score-ai-val">0</span></div>
      <div id="score-tie" class="score">Unentschieden: <span id="score-tie-val">0</span></div>
      <button id="reset-scores" class="small">Punkte zurücksetzen</button>
    </div>
    <div id="status">Dein Zug (X)</div>
    <div id="board" class="board" aria-label="Tic Tac Toe Spielfeld"></div>
    <div class="controls">
      <button id="restart">Neu starten</button>
    </div>
    <p class="hint">Klicke ein Feld, um zu spielen. Du bist X, der Computer ist O.</p>
  </main>
  <div id="victory-overlay" class="victory-overlay hidden" aria-hidden="true">
    <div class="victory-card">
      <div class="trophy">🏆</div>
      <div class="victory-text">Du hast gewonnen!</div>
    </div>
  </div>
  <div id="loss-overlay" class="loss-overlay hidden" aria-hidden="true">
    <div class="loss-card">
      <div class="sad">😢</div>
      <div class="loss-text">Du hast verloren.</div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
